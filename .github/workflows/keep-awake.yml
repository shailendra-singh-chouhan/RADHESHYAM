# Keeps the free Render instance awake during Indian market hours.
# Render's free tier sleeps after 15 min idle; a sleeping server records no prices.
# Runs every 10 min, Mon-Fri, 03:00-10:59 UTC = 08:30-16:29 IST. Free on public repos.
name: keep-awake
on:
  schedule:
    - cron: "*/10 3-10 * * 1-5"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://radheshyam-uq44.onrender.com/health || echo 000)
          echo "health status: $code"
          [ "$code" = "200" ] || echo "::warning::GOAT PRO health returned $code"
